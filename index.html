<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ada pesan buat kamu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b1c3a; --deep:#12132b; --pink:#ff6b9d; --sun:#ffd23f; --mint:#5eead4; --cream:#fff4d6;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--deep); color:var(--cream);
  font-family:'VT323',ui-monospace,Menlo,monospace; font-size:26px; line-height:1.25;
  overflow:hidden; image-rendering:pixelated;
}
/* bintang pixel */
.stars{position:fixed;inset:0;background-image:
  radial-gradient(var(--cream) 1.5px,transparent 2px),
  radial-gradient(var(--sun) 1.5px,transparent 2px),
  radial-gradient(var(--mint) 1.5px,transparent 2px);
  background-size:130px 130px,210px 210px,170px 170px;
  background-position:0 0,60px 90px,110px 30px; opacity:.55}
.stars::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,var(--night))}
.px{font-family:'Press Start 2P',ui-monospace,Menlo,monospace}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));text-align:center}
.hidden{display:none}

/* layar judul */
#title h1{font-size:clamp(16px,4.6vw,30px);line-height:1.7;margin:28px 0 8px;color:var(--sun);
  text-shadow:4px 4px 0 var(--pink)}
#title p{margin:0 0 36px;font-size:30px;color:var(--mint)}
#heart{width:168px;height:168px;object-fit:cover;border:4px solid var(--cream);box-shadow:0 0 0 4px var(--night),0 0 0 8px var(--pink),6px 6px 0 8px rgba(0,0,0,.45);animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.btn{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--night);background:var(--sun);
  border:0;padding:16px 22px;cursor:pointer;box-shadow:0 6px 0 #b8901a,0 0 0 4px var(--cream);
  transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b8901a,0 0 0 4px var(--cream)}
.btn:focus-visible,.mute:focus-visible{outline:4px solid var(--mint);outline-offset:6px}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

/* layar dialog */
#game{justify-content:flex-end;padding-bottom:max(28px,env(safe-area-inset-bottom))}
#scene{flex:1;display:flex;align-items:center;justify-content:center}
#scene img{width:clamp(110px,26vh,170px);height:clamp(110px,26vh,170px);object-fit:cover;border:4px solid var(--cream);box-shadow:0 0 0 4px var(--night),0 0 0 8px var(--mint);animation:bob 1.6s steps(2) infinite}
.dialog{position:relative;width:min(680px,100%);min-height:210px;text-align:left;cursor:pointer;
  background:var(--night);border:4px solid var(--cream);padding:34px 26px 38px;
  box-shadow:0 0 0 4px var(--night),0 0 0 8px var(--pink),8px 8px 0 8px rgba(0,0,0,.45)}
.tag{position:absolute;top:-22px;left:18px;background:var(--pink);color:var(--night);
  font-size:11px;padding:9px 12px;border:4px solid var(--cream)}
#text{font-size:clamp(25px,5.4vw,31px);min-height:5.6em;white-space:pre-wrap}
.next{position:absolute;right:20px;bottom:12px;font-size:12px;color:var(--sun);animation:blink .8s steps(2) infinite}
.dots{position:absolute;left:26px;bottom:14px;display:flex;gap:6px}
.dots i{width:10px;height:10px;background:#3b3d6e}
.dots i.on{background:var(--mint)}
.again{margin-top:22px}

.mute{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:5;font-family:'Press Start 2P',monospace;
  font-size:11px;color:var(--cream);background:var(--night);border:3px solid var(--cream);padding:10px 12px;cursor:pointer}
canvas{position:fixed;inset:0;pointer-events:none;z-index:4}
@media (prefers-reduced-motion:reduce){
  #heart,#scene img,.blink,.next{animation:none}
}
</style>
</head>

<script>
/* ===== UBAH BAGIAN INI ===== */
const TO   = "Diah Eka Safana"; // nama lengkap (tampil di layar judul)
const SHORT = "Ahli PDD";       // nama panggilan (tampil di surat)
const FROM = "Roy";             // namamu
const LETTER = [
  "Halo, " + SHORT + "!\nAku mau ngomong sesuatu sebentar, ya.",
  "Aku senang banget sudah kenal kamu.\nOh iya, anak pinguin di layar itu mirip kamu, soalnya lucu dan bikin orang ikut senyum.",
  "Jujur, sebenarnya aku pengen lebih dekat sama kamu.",
  "Bukan buat apa-apa. Aku cuma pengen lebih sering ngobrol, saling cerita, dan jadi teman yang beneran ada.",
  "Kalau kamu mau, kita mulai dari hal kecil aja. Ngopi bareng, atau main bareng.",
  "Makasih sudah baca sampai sini.",
  "Oh iya, ini ada sebuah hadiah dari aku. Bukan maksud apa-apa, cuma tanda kalau aku kagum sama kamu.\n\n- " + FROM
];
/* ========================== */

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('titleText').textContent = "UNTUK " + TO.toUpperCase();
$('tag').textContent = FROM.toUpperCase();

/* hati pixel */
const HEART = ["01100011000","11110111100","11111111110","11111111110","01111111100","00111111000","00011110000","00001100000","00000000000","00000000000"];
function drawHeart(svg){
  let s='';
  HEART.forEach((row,y)=>[...row].forEach((c,x)=>{
    if(c==='1') s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${(x<3&&y<3)?'#fff4d6':'#ff6b9d'}"/>`;
  }));
  svg.innerHTML=s;
}


/* musik chiptune (WebAudio, tanpa file) */
let ac, master, timer, step=0, nextT=0, musicOn=true;
const MEL=[523.25,659.25,783.99,659.25, 880,783.99,659.25,523.25, 587.33,698.46,880,698.46, 783.99,659.25,587.33,0];
const BAS=[130.81,0,0,0, 110,0,0,0, 87.31,0,0,0, 98,0,0,0];
function tone(f,t,d,type,v){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d);
}
function sched(){
  while(nextT<ac.currentTime+0.4){
    const i=step%16;
    if(MEL[i]) tone(MEL[i],nextT,0.17,'square',0.045);
    if(BAS[i]) tone(BAS[i],nextT,0.7,'triangle',0.11);
    nextT+=0.2; step++;
  }
}
function startMusic(){
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.connect(ac.destination);
    nextT=ac.currentTime+0.1; timer=setInterval(sched,100);
  }catch(e){ $('mute').classList.add('hidden'); }
}
$('mute').onclick=()=>{
  musicOn=!musicOn;
  if(master) master.gain.value=musicOn?1:0;
  $('mute').textContent="MUSIK: "+(musicOn?"ON":"OFF");
};

/* konfeti pixel */
const cv=$('fx'), cx=cv.getContext('2d'); let parts=[], raf=null;
function fit(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',fit); fit();
const COL=['#ff6b9d','#ffd23f','#5eead4','#fff4d6'];
function burst(n){
  n=reduce?Math.floor(n/4):n;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI-Math.PI, sp=6+Math.random()*9;
    parts.push({x:cv.width/2,y:cv.height*0.55,vx:Math.cos(a)*sp*(Math.random()*1.4),vy:Math.sin(a)*sp-2,
      s:6+Math.floor(Math.random()*3)*4,c:COL[i%4],life:150+Math.random()*60});
  }
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+20);
  parts.forEach(p=>{p.vy+=0.28;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.life--;cx.fillStyle=p.c;cx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)});
  raf=parts.length?requestAnimationFrame(loop):null;
}

/* surat: efek ketik */
let page=0, typing=false, tm=null;
const dots=$('dots'); LETTER.forEach(()=>dots.appendChild(document.createElement('i')));
function show(i){
  page=i; const msg=LETTER[i]; let n=0; typing=true;
  $('text').textContent=''; $('next').classList.add('hidden'); $('again').classList.add('hidden');
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k<=i));
  clearInterval(tm);
  if(reduce){ $('text').textContent=msg; done(); return; }
  tm=setInterval(()=>{
    n++; $('text').textContent=msg.slice(0,n);
    if(n%3===0&&ac&&musicOn) tone(1200,ac.currentTime,0.03,'square',0.015);
    if(n>=msg.length){clearInterval(tm);done()}
  },42);
}
function done(){
  typing=false; $('text').textContent=LETTER[page];
  if(page===LETTER.length-1){
    $('again').classList.remove('hidden'); burst(140);
    setTimeout(()=>burst(90),700); setTimeout(()=>burst(90),1400);
  } else { $('next').classList.remove('hidden'); }
}
function advance(){
  if(typing){ clearInterval(tm); done(); return; }
  if(page<LETTER.length-1) show(page+1);
}
$('dialog').onclick=advance;
$('dialog').onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();advance()} };

$('start').onclick=()=>{
  startMusic();
  $('title').classList.add('hidden'); $('game').classList.remove('hidden'); $('mute').classList.remove('hidden');
  $('dialog').focus(); show(0);
};
$('again').onclick=()=>show(0);
</script>
